# Installed to /etc/dailyprophet/hostapd.conf — rendered to /etc/hostapd/hostapd.conf in AP mode.
# interface / country_code are substituted by bootstrap.sh from /etc/default/dailyprophet-network

interface=wlan0
driver=nl80211
country_code=US
ssid=DailyProphet-Setup
hw_mode=g
channel=7
wmm_enabled=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=dailyprophet-setup
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP CCMP
rsn_pairwise=CCMP
